name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: "1.21"

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64, personal, prometheus]
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: Install linters
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      
      - name: Run goimports
        run: goimports -local github.com/digitaldrywood/github-integration-testing-demo -d .
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run staticcheck
        run: staticcheck ./...

  test:
    name: Unit Tests
    runs-on: [self-hosted, linux, x64, personal, prometheus]
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.txt

  build:
    name: Build
    runs-on: [self-hosted, linux, x64, personal, prometheus]
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: Build binary
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -o dist/app-${{ matrix.os }}-${{ matrix.arch }} ./src
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/

  # This job runs simulated integration tests that don't require external services
  integration-test-simulated:
    name: Integration Tests (Simulated)
    runs-on: [self-hosted, linux, x64, personal, prometheus]
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      
      - name: Run simulated integration tests
        run: |
          go test -v ./tests -tags=integration -storage -database -api \
            -timeout=5m
        env:
          STORAGE_TYPE: mock-s3
          DB_TYPE: mock-postgres
          API_TYPE: mock-rest
